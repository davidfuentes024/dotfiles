# ============================================================
# BASE
# ============================================================
set -g default-terminal "tmux-256color"
# WezTerm reports TERM=xterm-256color; enable true color for it
set -sa terminal-features ',xterm-256color:RGB'

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on

# ============================================================
# PREFIX
# ============================================================
# Only real Ctrl+A reaches tmux: in WezTerm, Cmd+A is sent as Super+A and
# swallowed (see linux/keyd/app.conf and wezterm.lua)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ============================================================
# PANES & NAVIGATION
# ============================================================
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

# ============================================================
# COPY MODE & CLIPBOARD
# ============================================================
# Copies go to the local system clipboard through the terminal (OSC 52),
# which also works when tmux runs on a remote host over SSH
set -g set-clipboard on
set -g mode-keys vi

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# ============================================================
# LOOK (One Dark + prefix feedback)
# ============================================================
set -g status-position bottom
set -g status-style bg=default,fg="#abb2bf"

set -g status-left-length 60
set -g status-right-length 80

# The left block turns yellow while the prefix (Ctrl+A) is active
set -g status-left "#{?client_prefix,#[bg=#e5c07b]#[fg=#282c34]#[bold] 󰌌 PREFIX ,#[bg=#61afef]#[fg=#282c34]#[bold] 󰆍 #S }#[bg=default,fg=default] "

set-window-option -g window-status-separator " "
set-window-option -g window-status-format "#[bg=#282c34,fg=#5c6370] #I 󰁕 #W "
set-window-option -g window-status-current-format "#[bg=#61afef,fg=#282c34,bold] #I 󰁔 #W "

set -g pane-border-style "fg=#3e4451"
set -g pane-active-border-style "fg=#61afef"

# Right side: current directory name and time
set -g status-right "#[bg=#282c34,fg=#5c6370]  #(basename #{pane_current_path}) #[bg=#282c34,fg=#abb2bf] 󱎫 %H:%M #[bg=default] "

# ============================================================
# PLUGINS
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Also restore nvim sessions
set -g @resurrect-strategy-nvim 'session'

# Initialize TPM (must stay at the end of the file)
run '~/.config/tmux/plugins/tpm/tpm'
