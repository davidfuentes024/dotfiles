# spotify_player settings (shared by Linux and macOS)

# Own Spotify developer app: the shared default client ID is rate limited
# (HTTP 429) for everyone. The ID lives outside the repo, created by hand in
# ~/.config/spotify-player/client_id.
client_id_command = { command = "sh", args = ["-c", "cat \"$HOME/.config/spotify-player/client_id\""] }

# Colors come from theme.toml, generated by the `theme` command
theme = "dotfiles"

# Track changes already show in the bar's music icon and panel
enable_notify = false
enable_cover_image_cache = false

# Look: rounded panels, a thin progress line and no empty genre line
border_type = "Rounded"
progress_bar_type = "Line"
playback_format = "{status} {track} • {artists} {liked}\n{album}\n{metadata}"

# Mouse wheel over the app changes the volume
enable_mouse_scroll_volume = true
volume_scroll_step = 5

[layout]
# Content on top, playback controls at the bottom like a regular player
playback_window_position = "Bottom"
playback_window_height = 5
