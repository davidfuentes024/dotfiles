# Per-app overrides for /etc/keyd/default.conf, applied by keyd-application-mapper.
# Section names are window classes normalized to lowercase-with-dashes.

# WezTerm: send Cmd as Super (like macOS) instead of Ctrl, so terminal
# shortcuts (tabs, splits, copy/paste) never collide with real Ctrl keys
# used by the shell, tmux (prefix C-a) and nvim.
[org-wezfurlong-wezterm]

cmd.a = M-a
cmd.c = M-c
cmd.v = M-v
cmd.x = M-x
cmd.t = M-t
cmd.w = M-w
cmd.d = M-d
cmd.f = M-f
cmd.n = M-n
cmd.z = M-z

# Cmd+N: WezTerm tab N
cmd.1 = M-1
cmd.2 = M-2
cmd.3 = M-3
cmd.4 = M-4
cmd.5 = M-5
cmd.6 = M-6
cmd.7 = M-7
cmd.8 = M-8
cmd.9 = M-9
cmd.0 = M-0
