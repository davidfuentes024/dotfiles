# Per-app overrides for /etc/keyd/default.conf, applied by keyd-application-mapper.
# Section names are window classes normalized to lowercase-with-dashes.

# WezTerm: send Cmd as Super (like macOS) instead of Ctrl, so terminal
# shortcuts (tabs, splits, copy/paste) never collide with real Ctrl keys
# used by the shell, tmux (prefix C-a) and nvim.
[org-wezfurlong-wezterm]

cmd.a = M-a
cmd.c = M-c
cmd.v = M-v
cmd.x = M-x
cmd.t = M-t
cmd.w = M-w
cmd.d = M-d
cmd.f = M-f
cmd.n = M-n
cmd.z = M-z

# Cmd+N: WezTerm tab N
cmd.1 = M-1
cmd.2 = M-2
cmd.3 = M-3
cmd.4 = M-4
cmd.5 = M-5
cmd.6 = M-6
cmd.7 = M-7
cmd.8 = M-8
cmd.9 = M-9
cmd.0 = M-0

# Games: standard keyboard. Ctrl and Alt reach the game untouched (no desktop
# shortcuts, no Cmd layer), so in-game binds like Ctrl+Q or Ctrl+1 just work.
# Ctrl+Left/Right keep switching desktops everywhere, and Alt+Tab (handled by
# Hyprland) still switches out of the game.
# Alt is layer(alt), not plain leftalt: it still holds Alt, but a plain key
# bypasses the alt layer, so alt.<key> overrides (see [cs2]) would never fire.

# Proton/Steam games (window class steam_app_<id>)
[steam-app-*]

leftalt = layer(alt)
rightalt = layer(alt)
control.q = C-q
control.1 = C-1
control.2 = C-2
control.3 = C-3
control.4 = C-4
control.5 = C-5
control.6 = C-6
control.7 = C-7
control.8 = C-8
control.9 = C-9
control.0 = C-0
control+shift.1 = C-S-1
control+shift.2 = C-S-2
control+shift.3 = C-S-3
control+shift.4 = C-S-4
control+shift.5 = C-S-5
control+shift.6 = C-S-6
control+shift.7 = C-S-7
control+shift.8 = C-S-8
control+shift.9 = C-S-9
control+shift.0 = C-S-0

# Counter-Strike 2
[cs2]

leftalt = layer(alt)
rightalt = layer(alt)
# Cmd (Alt) still reaches Hyprland for desktop shortcuts: quit, launcher,
# switch window, file manager, float, split, minimize, bar, show desktop and
# window screenshot. Alt+Enter is left alone: CS2 uses it to toggle fullscreen.
alt.q = M-q
alt.space = M-space
alt.tab = M-tab
alt.e = M-e
alt.g = M-g
alt.j = M-j
alt.m = M-m
alt.dot = M-dot
alt.f3 = M-f3
alt.sysrq = M-sysrq
control.q = C-q
control.1 = C-1
control.2 = C-2
control.3 = C-3
control.4 = C-4
control.5 = C-5
control.6 = C-6
control.7 = C-7
control.8 = C-8
control.9 = C-9
control.0 = C-0
control+shift.1 = C-S-1
control+shift.2 = C-S-2
control+shift.3 = C-S-3
control+shift.4 = C-S-4
control+shift.5 = C-S-5
control+shift.6 = C-S-6
control+shift.7 = C-S-7
control+shift.8 = C-S-8
control+shift.9 = C-S-9
control+shift.0 = C-S-0

# Gamescope sessions
[gamescope]

leftalt = layer(alt)
rightalt = layer(alt)
control.q = C-q
control.1 = C-1
control.2 = C-2
control.3 = C-3
control.4 = C-4
control.5 = C-5
control.6 = C-6
control.7 = C-7
control.8 = C-8
control.9 = C-9
control.0 = C-0
control+shift.1 = C-S-1
control+shift.2 = C-S-2
control+shift.3 = C-S-3
control+shift.4 = C-S-4
control+shift.5 = C-S-5
control+shift.6 = C-S-6
control+shift.7 = C-S-7
control+shift.8 = C-S-8
control+shift.9 = C-S-9
control+shift.0 = C-S-0
