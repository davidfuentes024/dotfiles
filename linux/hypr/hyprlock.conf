# Lock screen (Cmd+Ctrl+Q). Colors follow the active theme.

# Defaults (neon, soft black), overridden by the file the `theme` command generates
$bg = rgb(1c1c1e)
$fg = rgb(dcdfe4)
$accent = rgb(4aa5f0)
$accent_alt = rgb(d18f52)
$red = rgb(e05561)
$font = JetBrainsMono Nerd Font
source = ~/.local/state/theme/hyprlock.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/Pictures/wallpapers/fallenangels.png
    blur_passes = 3
    brightness = 0.5
}

label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = 72
    color = $fg
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    outline_thickness = 1
    rounding = 0
    font_family = $font
    outer_color = $accent
    inner_color = $bg
    font_color = $fg
    check_color = $accent_alt
    fail_color = $red
    placeholder_text = password
    fade_on_empty = false
    position = 0, -20
    halign = center
    valign = center
}
