# Lock screen (Cmd+Ctrl+Q). Minimal style for now; the theme phase will
# restyle it with the shared palette.

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/Pictures/wallpapers/fallenangels.png
    blur_passes = 3
    brightness = 0.5
}

label {
    monitor =
    text = $TIME
    font_family = JetBrains Mono
    font_size = 72
    color = rgb(dcdfe4)
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    outline_thickness = 1
    rounding = 0
    font_family = JetBrains Mono
    outer_color = rgb(4aa5f0)
    inner_color = rgb(1c1c1e)
    font_color = rgb(dcdfe4)
    check_color = rgb(d18f52)
    fail_color = rgb(e05561)
    placeholder_text = password
    fade_on_empty = false
    position = 0, -20
    halign = center
    valign = center
}
