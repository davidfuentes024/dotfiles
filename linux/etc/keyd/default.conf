# Teclado estilo Mac
#   Alt = Cmd     (Cmd+tecla de edicion actua como Ctrl; el resto llega como Super al WM)
#   Win = Option  (llega como Alt; Option+flechas/borrar actua por palabra)
[ids]
*

[main]
leftalt = layer(cmd)
rightalt = layer(cmd)
leftmeta = layer(opt)

# Escape <-> Mayus
capslock = esc
esc = capslock

[cmd:M]
# portapapeles via Insert: tambien funciona en terminales sin enviar Ctrl+C (SIGINT)
c = C-insert
v = S-insert
x = S-delete

# edicion y apps
a = C-a
z = C-z
y = C-y
s = C-s
f = C-f
t = C-t
w = C-w
l = C-l
r = C-r
n = C-n
o = C-o
p = C-p
d = C-d
b = C-b
i = C-i
u = C-u

# navegacion de linea / documento
left = home
right = end
up = C-home
down = C-end
backspace = macro(S-home delete)

[opt:A]
# movimiento y borrado por palabra
left = C-left
right = C-right
backspace = C-backspace
delete = C-delete

[control]
# Ctrl+flechas: cambiar de escritorio (Hyprland escucha Super+Ctrl+flechas)
left = M-C-left
right = M-C-right
