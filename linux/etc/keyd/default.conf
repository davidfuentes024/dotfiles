# Teclado estilo Mac
#   Alt = Cmd     (Cmd+tecla de edicion actua como Ctrl; el resto llega como Super al WM)
#   Win = Option  (llega como Alt; Option+flechas/borrar actua por palabra)
[ids]
*

[main]
leftalt = layer(cmd)
rightalt = layer(cmd)
leftmeta = layer(opt)

# Escape <-> Mayus
capslock = esc
esc = capslock

[cmd:M]
# portapapeles via Insert: tambien funciona en terminales sin enviar Ctrl+C (SIGINT)
c = C-insert
v = S-insert
x = S-delete

# edicion y apps
a = C-a
z = C-z
y = C-y
s = C-s
f = C-f
t = C-t
w = C-w
l = C-l
r = C-r
n = C-n
o = C-o
p = C-p
d = C-d
b = C-b
i = C-i
u = C-u

# navegacion de linea / documento
left = home
right = end
up = C-home
down = C-end
backspace = macro(S-home delete)

# Cmd+N: tab N in the current app (Linux apps use Ctrl+N; WezTerm is
# overridden to Super+N in ~/.config/keyd/app.conf)
1 = C-1
2 = C-2
3 = C-3
4 = C-4
5 = C-5
6 = C-6
7 = C-7
8 = C-8
9 = C-9
0 = C-0

[cmd+shift]
# Cmd+Shift+<key> for Hyprland shortcuts (sent as Super+Shift+<key>; plain
# Cmd+<key> becomes Ctrl+<key> for apps): V clipboard, L lyrics, K edit lyrics,
# M music (spotify_player)
v = M-S-v
l = M-S-l
k = M-S-k
m = M-S-m

[opt:A]
# movimiento y borrado por palabra
left = C-left
right = C-right
backspace = C-backspace
delete = C-delete

[control]
# Ctrl+flechas: cambiar de escritorio (Hyprland escucha Super+Ctrl+flechas)
left = M-C-left
right = M-C-right

# Ctrl+Q: delete the current desktop. Sent as Super+F13, a combo nothing else
# uses (Super+Ctrl+Q is already the lock screen)
q = M-f13

# Ctrl+N: go to desktop N (macOS-style); Hyprland listens on Super+Ctrl+N so
# real Ctrl never collides with Cmd+N, which keyd also turns into Ctrl+N
1 = M-C-1
2 = M-C-2
3 = M-C-3
4 = M-C-4
5 = M-C-5
6 = M-C-6
7 = M-C-7
8 = M-C-8
9 = M-C-9
0 = M-C-0

[control+shift]
# Ctrl+Shift+N: move the active window to desktop N
1 = M-C-S-1
2 = M-C-S-2
3 = M-C-S-3
4 = M-C-S-4
5 = M-C-S-5
6 = M-C-S-6
7 = M-C-S-7
8 = M-C-S-8
9 = M-C-S-9
0 = M-C-S-0
