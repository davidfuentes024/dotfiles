# ============================================================
# CONFIGURACIÓN BASE
# ============================================================
set -g default-terminal "screen-256color"
set-option -sa terminal-features ',xterm-wezterm:RGB'

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on

# ============================================================
# PREFIX
# ============================================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ============================================================
# PANES & NAVEGACIÓN
# ============================================================
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.config/tmux/tmux.conf \; display-message "¡Tmux recargado!"

# ============================================================
# ESTÉTICA DINÁMICA (One Dark + Feedback Visual)
# ============================================================
set -g status-position bottom
set -g status-style bg=default,fg="#abb2bf"

set -g status-left-length 60
set -g status-right-length 80

# 🌟 DINÁMICO: Este bloque cambia de color (Azul a Naranja/Rojo) 
# al presionar 'Ctrl + A', indicando visualmente que el Prefix está activo.
set -g status-left "#{?client_prefix,#[bg=#e5c07b]#[fg=#282c34]#[bold] 󰌌 PREFIX ,#[bg=#61afef]#[fg=#282c34]#[bold] 󰆍 #S }#[bg=default,fg=default] "

# Pestañas limpias y modernas
set-window-option -g window-status-separator " "
set-window-option -g window-status-format "#[bg=#282c34,fg=#5c6370] #I 󰁕 #W "
set-window-option -g window-status-current-format "#[bg=#61afef,fg=#282c34,bold] #I 󰁔 #W "

# Bordes de paneles
set -g pane-border-style "fg=#3e4451"
set -g pane-active-border-style "fg=#61afef"

# Lado derecho: Directorio actual recortado y Hora
set -g status-right "#[bg=#282c34,fg=#5c6370]  #(basename #{pane_current_path}) #[bg=#282c34,fg=#abb2bf] 󱎫 %H:%M #[bg=default] "

# ============================================================
# PLUGINS (Tmux Resurrect)
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Opcional recomendado: restaurar también las sesiones de Neovim si usas sesiones de nvim
set -g @resurrect-strategy-nvim 'session'

# Inicializar TPM (DEBE ir al final del archivo)
run '~/.tmux/plugins/tpm/tpm'
